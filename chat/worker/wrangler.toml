name = "viral-cage-chat"
main = "src/index.js"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "CHAT_ROOMS"
class_name = "ChatRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

[[durable_objects.bindings]]
name = "VOICE_HUB"
class_name = "ChatVoiceHub"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ChatVoiceHub"]

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "P2P_ROOMS"
class_name = "PrivateP2PRoom"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["PrivateP2PRoom"]
