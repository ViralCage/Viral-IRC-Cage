name: Unity Bike Racer WebGL

on:
  workflow_dispatch:
  push:
    branches:
      - feature/unity-bike-racer
    paths:
      - "unity-bike-racer/**"
      - ".github/workflows/unity-bike-racer-webgl.yml"

permissions:
  contents: read

jobs:
  build-webgl:
    name: Build WebGL test game
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Build Unity WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: unity-bike-racer
          unityVersion: 6000.3.0f1
          targetPlatform: WebGL
          buildMethod: WebBuild.BuildWebTest
          buildsPath: build

      - name: Upload WebGL test build
        uses: actions/upload-artifact@v4
        with:
          name: viral-cage-bike-racer-webgl
          path: test-unity/
          if-no-files-found: error
          retention-days: 14
