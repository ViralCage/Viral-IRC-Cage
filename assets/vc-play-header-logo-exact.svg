<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 88" role="img" aria-labelledby="title desc">
  <title id="title">VC PLAY</title>
  <desc id="desc">A premium gradient VC monogram with a centered crown above the letters, paired with the VC PLAY wordmark and PLAY CONNECT ENJOY tagline.</desc>
  <defs>
    <linearGradient id="cage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e879f9"/><stop offset=".48" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#67e8f9"/><stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#c084fc"/><stop offset=".56" stop-color="#818cf8"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Refined monogram frame -->
  <path d="M8 25 39 7 70 25 70 61 39 79 8 61Z"
        fill="#111827" fill-opacity=".36" stroke="#64748b" stroke-opacity=".34" stroke-width="1.2"/>
  <path d="M17 28 38 67 59 28" fill="none" stroke="url(#cage)"
        stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M61 34 C56 28 47 28 42 34 C36 41 37 53 43 59 C48 65 57 64 62 59"
        fill="none" stroke="url(#cyan)" stroke-width="7.5" stroke-linecap="round"/>

  <!-- Crown centered above the VC monogram -->
  <path d="M28 8 33 15 39 9 44 16 50 8 47 23 31 23Z"
        fill="url(#cage)" stroke="#f0abfc" stroke-width=".9" stroke-linejoin="round" filter="url(#softGlow)"/>
  <circle cx="39" cy="12" r="1.4" fill="#fff" opacity=".9"/>

  <!-- Wordmark -->
  <text x="82" y="49" font-family="Orbitron, Rajdhani, Arial, sans-serif"
        font-size="35" font-weight="900" letter-spacing="1.1" fill="url(#play)">PLAY</text>
  <path d="M84 58H264" stroke="url(#play)" stroke-width="1.2" stroke-linecap="round" opacity=".72"/>
  <text x="85" y="75" font-family="Arial, Helvetica, sans-serif"
        font-size="9.2" font-weight="700" letter-spacing="2.45" fill="#dbeafe">PLAY • CONNECT • ENJOY</text>
</svg>