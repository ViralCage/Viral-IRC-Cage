<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 303 70" role="img" aria-labelledby="title desc">
  <title id="title">VC PLAY</title>
  <desc id="desc">Purple and blue crowned VC mark with VC PLAY lettering.</desc>
  <defs>
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d946ef"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="50%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>
    <linearGradient id="vcText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff"/><stop offset="100%" stop-color="#00a8ff"/>
    </linearGradient>
    <linearGradient id="playText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/><stop offset="60%" stop-color="#2563eb"/><stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>
  </defs>
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur stdDeviation="2.1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- V: its right arm rises directly into the crown -->
    <path d="M8 17 27 59 46 17" stroke="url(#purpleGradient)" stroke-width="10.5"/>
    <!-- C: deliberately open at the center to create a clear cut -->
    <path d="M81 23 C74 17 63 17 56 25 C49 33 49 45 56 53 C63 61 74 60 81 54"
          stroke="url(#blueGradient)" stroke-width="10"/>
  </g>
  <path d="M35 5 41 14 46 8 52 14 58 5 56 20 37 20Z"
        fill="url(#purpleGradient)" stroke="#e9a8ff" stroke-width="1.1"
        stroke-linejoin="round" filter="url(#glow)"/>
  <g font-family="Orbitron, Rajdhani, Arial, sans-serif" font-weight="900">
    <text x="91" y="51" font-size="32" letter-spacing="1.1" fill="url(#vcText)">VC</text>
    <text x="145" y="51" font-size="32" letter-spacing="1.1" fill="url(#playText)">PLAY</text>
  </g>
</svg>