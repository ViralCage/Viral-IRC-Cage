<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <title>VIRAL CAGE PLAY — Pro Theme</title>
    <style>
        :root {
            --bg-1: #07111f;
            --bg-2: #0d1b2a;
            --bg-3: #17263d;
            --panel-strong: rgba(10, 15, 28, 0.82);
            --panel-soft: rgba(15, 23, 42, 0.68);
            --panel-glass: rgba(18, 27, 43, 0.72);
            --line: rgba(148, 163, 184, 0.22);
            --line-strong: rgba(96, 165, 250, 0.32);
            --text: #edf6ff;
            --muted: #a7bdd9;
            --primary: #60a5fa;
            --primary-2: #8b5cf6;
            --success: #34d399;
            --warning: #fbbf24;
            --danger: #fb7185;
            --board-wood-1: #d7b894;
            --board-wood-2: #9b6743;
            --shadow: 0 24px 60px rgba(2, 6, 23, 0.6);
            --radius-xl: 28px;
            --radius-lg: 18px;
            --radius-md: 12px;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            font-family: Inter, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at top left, rgba(96, 165, 250, 0.18), transparent 24%),
                radial-gradient(circle at top right, rgba(139, 92, 246, 0.22), transparent 30%),
                linear-gradient(160deg, var(--bg-1), var(--bg-2) 30%, var(--bg-3));
            color: var(--text);
        }

        body {
            display: grid;
            place-items: center;
            padding: 32px 18px;
        }

        #bagchal-blogger-container {
            position: relative;
            width: min(540px, 100%);
            padding: 18px;
            border: 1px solid var(--line);
            border-radius: var(--radius-xl);
            background: linear-gradient(180deg, rgba(15,23,42,0.82), rgba(15,23,42,0.64));
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            overflow: hidden;
            isolation: isolate;
        }

        #bagchal-blogger-container::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(96,165,250,0.10), rgba(139,92,246,0.10), transparent 62%);
            pointer-events: none;
            z-index: 0;
        }

        #bagchal-blogger-container > * {
            position: relative;
            z-index: 1;
        }

        #bagchal-blogger-container .game-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin: 0 0 18px;
            padding-right: 92px;
            min-height: 56px;
        }

        #bagchal-blogger-container .title-wrap {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        #bagchal-blogger-container .eyebrow {
            display: block;
            color: #9dd1ff;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            opacity: 0.9;
        }

        #bagchal-blogger-container h2 {
            margin: 0;
            color: var(--text);
            font-size: clamp(1.55rem, 3vw, 2.1rem);
            letter-spacing: -0.06em;
            font-weight: 900;
            line-height: 1.1;
        }

        #bagchal-blogger-container #fullscreenBtn {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 5;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 9px 12px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: #fff;
            font: inherit;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 12px 20px rgba(37, 99, 235, 0.32);
        }

        #bagchal-blogger-container .status-board {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 14px;
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(96,165,250,0.08), rgba(139,92,246,0.08));
        }

        #bagchal-blogger-container .status-card {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 12px 10px;
            border: 1px solid rgba(148,163,184,0.14);
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.58);
            text-align: center;
        }

        #bagchal-blogger-container .status-label {
            display: block;
            margin-bottom: 6px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--muted);
        }

        #bagchal-blogger-container .status-value {
            font-size: 1rem;
            font-weight: 800;
            color: var(--text);
            white-space: nowrap;
        }

        #bagchal-blogger-container .status-value.turn-goat { color: #7dd3fc; }
        #bagchal-blogger-container .status-value.turn-tiger { color: #fda4af; }

        #bagchal-blogger-container .turn-notification {
            margin: 0 0 14px;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(148,163,184,0.22);
            background: rgba(15,23,42,0.75);
            color: var(--text);
            text-align: center;
            font-weight: 800;
        }

        #bagchal-blogger-container .turn-notification.your-turn {
            background: linear-gradient(135deg, rgba(16,185,129,0.14), rgba(52,211,153,0.06));
            border-color: rgba(52,211,153,0.4);
            color: #b8f7d8;
        }

        #bagchal-blogger-container .turn-notification.opponent-turn {
            background: linear-gradient(135deg, rgba(251,191,36,0.12), rgba(251,113,133,0.06));
            border-color: rgba(251,191,36,0.38);
            color: #f9e7a1;
        }

        #bagchal-blogger-container .board-container {
            position: relative;
            padding: 18px 14px 12px;
            border: 1px solid rgba(148,163,184,0.18);
            border-radius: 20px;
            background: linear-gradient(145deg, rgba(15,23,42,0.92), rgba(15,23,42,0.66));
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
        }

        #bagchal-blogger-container .canvas-aspect-ratio-box {
            position: relative;
            width: 100%;
            min-width: 0;
            aspect-ratio: 1 / 1;
            border-radius: 18px;
            overflow: hidden;
            background:
                linear-gradient(45deg, rgba(255,255,255,0.07), transparent 60%),
                linear-gradient(135deg, var(--board-wood-1) 0%, #d0a77a 48%, var(--board-wood-2) 100%);
            border: 2px solid rgba(255,255,255,0.18);
            box-shadow: inset 0 0 22px rgba(0,0,0,0.12);
        }

        #bagchal-blogger-container .canvas-aspect-ratio-box::before {
            content: "";
            position: absolute;
            inset: 14px;
            border-radius: 14px;
            background:
                repeating-linear-gradient(
                    to right,
                    rgba(255,255,255,0.10),
                    rgba(255,255,255,0.10) 1px,
                    transparent 1px,
                    transparent 12.5%
                ),
                repeating-linear-gradient(
                    to bottom,
                    rgba(0,0,0,0.04),
                    rgba(0,0,0,0.04) 1px,
                    transparent 1px,
                    transparent 12.5%
                );
            pointer-events: none;
        }

        #bagchal-blogger-container canvas {
            display: block !important;
            width: 100%;
            height: 100%;
            max-width: 100%;
            visibility: visible !important;
            opacity: 1 !important;
            touch-action: manipulation;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            position: relative;
            z-index: 1;
        }

        #bagchal-blogger-container .game-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 16px;
        }

        #bagchal-blogger-container .game-controls select,
        #bagchal-blogger-container .game-controls button {
            flex: 1 1 140px;
            min-height: 44px;
            padding: 10px 14px;
            border: 1px solid rgba(148,163,184,0.2);
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(15,23,42,0.9), rgba(30,41,59,0.78));
            color: var(--text);
            font: inherit;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(15, 23, 42, 0.28);
        }

        #bagchal-blogger-container .game-controls button.primary-btn {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            border: none;
            box-shadow: 0 12px 20px rgba(37,99,235,0.34);
        }

        #bagchal-blogger-container .compact-instructions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 16px;
            color: var(--muted);
            font-size: 12px;
        }

        #bagchal-blogger-container .compact-instructions #instructionsToggleBtn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 7px 10px;
            border: 1px solid rgba(148,163,184,0.22);
            border-radius: 10px;
            background: rgba(148,163,184,0.08);
            color: var(--text);
            font: inherit;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        #bagchal-blogger-container .instructions-content {
            display: none;
            margin-top: 10px;
            padding: 12px 14px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.56);
            color: var(--muted);
            line-height: 1.55;
            font-size: 12px;
        }

        #bagchal-blogger-container .instructions-content.open {
            display: block;
        }

        #bagchal-blogger-container .game-mode-below-board {
            margin-top: 18px;
            padding: 12px 14px;
            border: 1px solid rgba(96,165,250,0.35);
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(96,165,250,0.12), rgba(59,130,246,0.04));
        }

        #bagchal-blogger-container .game-mode-below-board label {
            display: inline-block;
            margin-bottom: 8px;
            color: #9dd1ff;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        #bagchal-blogger-container .game-mode-below-board #gameSelection {
            width: 100%;
            min-height: 42px;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid rgba(96,165,250,0.45);
            background: rgba(10, 15, 25, 0.78);
            color: var(--text);
            font: inherit;
            font-weight: 700;
        }

        #bagchal-blogger-container #onlinePanel {
            margin-top: 18px;
            padding: 14px;
            border: 1px solid rgba(96,165,250,0.32);
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(15,23,42,0.8), rgba(30,41,59,0.82));
        }

        #bagchal-blogger-container #onlinePanel > div:first-child {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            color: #dfeeff;
            font-weight: 800;
        }

        #bagchal-blogger-container #onlinePanel > div:nth-child(3) {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        #bagchal-blogger-container #onlinePanel button,
        #bagchal-blogger-container #onlinePanel select,
        #bagchal-blogger-container #onlinePanel input {
            min-height: 42px;
            border-radius: 10px;
            border: 1px solid rgba(148,163,184,0.2);
            background: rgba(15,23,42,0.75);
            color: var(--text);
            font: inherit;
            font-weight: 700;
        }

        #bagchal-blogger-container #onlinePanel #roomCodeInput {
            flex: 1 1 140px;
            padding: 10px 12px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            text-align: center;
        }

        #bagchal-blogger-container #onlinePanel #joinRoomBtn,
        #bagchal-blogger-container #onlinePanel #createRoomBtn,
        #bagchal-blogger-container #onlinePanel #quickMatchBtn,
        #bagchal-blogger-container #onlinePanel #copyRoomCodeBtn {
            flex: 1 1 110px;
            cursor: pointer;
        }

        #bagchal-blogger-container #onlinePanel #joinRoomBtn { background: linear-gradient(135deg, #2563eb, #1d4ed8); }
        #bagchal-blogger-container #onlinePanel #createRoomBtn { background: linear-gradient(135deg, #10b981, #059669); }
        #bagchal-blogger-container #onlinePanel #quickMatchBtn { background: linear-gradient(135deg, #f97316, #ec4899); }
        #bagchal-blogger-container #onlinePanel #copyRoomCodeBtn { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }

        #bagchal-blogger-container:fullscreen,
        #bagchal-blogger-container.fullscreen-fallback {
            position: fixed !important;
            inset: 0 !important;
            z-index: 2147482000 !important;
            display: block;
            width: 100% !important;
            max-width: none !important;
            min-width: 0 !important;
            height: 100vh !important;
            height: 100dvh !important;
            min-height: 0 !important;
            margin: 0 !important;
            padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)) !important;
            overflow-x: hidden !important;
            overflow-y: auto !important;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            border-radius: 0 !important;
            background: linear-gradient(160deg, var(--bg-1), var(--bg-2) 30%, var(--bg-3));
            box-shadow: none;
        }

        html.bagchal-fullscreen-active,
        body.bagchal-fullscreen-active {
            overflow: hidden !important;
            overscroll-behavior: none;
            touch-action: pan-y;
        }

        @media (max-width: 520px) {
            #bagchal-blogger-container {
                padding: 14px;
            }

            #bagchal-blogger-container .game-topbar {
                padding-right: 80px;
            }

            #bagchal-blogger-container .status-board {
                grid-template-columns: 1fr;
            }

            #bagchal-blogger-container .game-controls {
                flex-direction: column;
            }

            #bagchal-blogger-container .game-controls button,
            #bagchal-blogger-container .game-controls select {
                flex-basis: auto;
            }
        }
    </style>
</head>
<body>
    <div id="bagchal-blogger-container">
        <div class="game-topbar">
            <div class="title-wrap">
                <span class="eyebrow">Strategy Arena</span>
                <h2>Bagchal</h2>
            </div>
            <button id="fullscreenBtn">Fullscreen</button>
        </div>

        <div class="status-board">
            <div class="status-card">
                <span class="status-label">Turn</span>
                <span class="status-value turn-goat">Goat</span>
            </div>
            <div class="status-card">
                <span class="status-label">Moves</span>
                <span class="status-value">18</span>
            </div>
            <div class="status-card">
                <span class="status-label">Mode</span>
                <span class="status-value">Pro</span>
            </div>
        </div>

        <div class="turn-notification your-turn">Your turn — place a goat</div>

        <div class="board-container">
            <div class="canvas-aspect-ratio-box">
                <canvas></canvas>
            </div>
        </div>

        <div class="game-controls">
            <button class="primary-btn">New Game</button>
            <button>Undo</button>
            <button>Reset Board</button>
            <select>
                <option>Classic</option>
                <option>Timed Match</option>
                <option>Pro League</option>
            </select>
        </div>

        <div class="compact-instructions">
            <span>Fast tactical mode</span>
            <button id="instructionsToggleBtn">Rules</button>
        </div>

        <div class="instructions-content" id="instructionsPanel">
            Place goats on empty intersections, then move them to trap the tiger. Control the center and keep your pieces flexible.
        </div>

        <div class="game-mode-below-board">
            <label for="gameSelection">Game Mode</label>
            <select id="gameSelection">
                <option>Local Match</option>
                <option>Online Arena</option>
                <option>Bot Challenge</option>
            </select>
        </div>

        <div id="onlinePanel">
            <div>
                <span>Online</span>
                <span>Room Ready</span>
            </div>
            <div>
                <input id="roomCodeInput" type="text" value="VC-2048" aria-label="Room code">
            </div>
            <div>
                <button id="joinRoomBtn">Join</button>
                <button id="createRoomBtn">Create</button>
                <button id="quickMatchBtn">Quick Match</button>
                <button id="copyRoomCodeBtn">Copy</button>
            </div>
        </div>
    </div>

    <script>
        const toggle = document.getElementById('instructionsToggleBtn');
        const panel = document.getElementById('instructionsPanel');
        toggle.addEventListener('click', () => {
            panel.classList.toggle('open');
        });
    </script>
</body>
</html>
